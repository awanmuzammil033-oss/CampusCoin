<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus Coin — track your allowance and expenses, see where the money goes, and get simple saving tips. Built for students." />
    <meta name="theme-color" content="#0F766E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Rubik:ital,wght@0,300..900;1,300..900&family=Poiret+One&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <title>Campus Coin — Smart Spending, Student Style</title>
    <script>
      // Apply theme and text size before the first paint so the page never
      // flashes light-then-dark. localStorage mirrors the account setting
      // (the server stays the source of truth once you are signed in).
      // Friendly by default: start on light unless this device already
      // picked a theme — a student money app should not open like a
      // terminal on a system with dark mode enabled.
      (function () {
        try {
          var theme = localStorage.getItem('cc.theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);

          var scale = localStorage.getItem('cc.fontScale') || '2';
          var sizes = { '1': '14px', '2': '16px', '3': '18px', '4': '20px' };
          document.documentElement.style.fontSize = sizes[scale] || '16px';
        } catch (e) {
          /* private mode: fall back to the stylesheet defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
